name: Deploy Backend Services

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-2

jobs:
  deploy-django-lambda:
    name: Deploy Django to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Dependencies & Zappa
        run: |
          pip install virtualenv
          virtualenv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install zappa

      - name: Deploy via Zappa
        run: |
          source venv/bin/activate
          # Try updating the existing deployment, if it fails, deploy a new one
          zappa update production || zappa deploy production

  deploy-fastapi-ec2:
    name: Deploy FastAPI (AI Engine) to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/neoEventBackend
            git pull origin main
            
            # Stop existing containers if any to prevent conflicts
            docker-compose -f docker-compose.prod.yml stop fastapi || true
            
            # Rebuild and start only the FastAPI, DB, and Redis containers (Excluding Django/Celery)
            docker-compose -f docker-compose.prod.yml up -d --build fastapi db redis
            
            # Clean up dangling images to save space
            docker image prune -f
