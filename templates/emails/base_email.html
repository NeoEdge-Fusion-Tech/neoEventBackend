<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NeoEvents Notification{% endblock %}</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #080C14;
            color: #ffffff;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #121A2B;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            margin-top: 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #FFB173;
            text-decoration: none;
            letter-spacing: -0.03em;
        }
        .content {
            color: #CBD5E1;
            font-size: 16px;
        }
        .highlight {
            color: #FFB173;
            font-weight: 600;
        }
        .button-container {
            text-align: center;
            margin: 40px 0;
        }
        .btn {
            background: linear-gradient(135deg, #FFB173, #ff9d52);
            color: #080C14;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            display: inline-block;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 13px;
            color: #475569;
        }
    </style>
</head>
<body style="background-color: #080C14; color: #ffffff; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #080C14;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table class="container" width="600" border="0" cellspacing="0" cellpadding="0" style="background-color: #121A2B; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); margin: 0 auto;">
                    <tr>
                        <td style="padding: 40px 20px;">
                            <div class="header" style="text-align: center; margin-bottom: 30px;">
                                <a href="{{ frontend_url|default:'https://neoevents.com' }}" class="logo" style="font-size: 28px; font-weight: 900; color: #FFB173; text-decoration: none; letter-spacing: -0.03em; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB173" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; display: inline-block;">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <circle cx="12" cy="12" r="2"></circle>
                                    </svg>
                                    <span style="vertical-align: middle;">NeoEvents</span>
                                </a>
                            </div>
                            
                            <div class="content" style="color: #CBD5E1; font-size: 16px;">
                                {% block content %}
                                {% endblock %}
                            </div>
                            
                            <div class="footer" style="text-align: center; margin-top: 40px; font-size: 13px; color: #475569;">
                                <p>&copy; {% now "Y" %} NeoEvents. All rights reserved.</p>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
