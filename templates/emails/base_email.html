<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Basic reset for email clients */
        body { margin: 0; padding: 0; background-color: #f4f7fa; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        table { border-spacing: 0; border-collapse: collapse; width: 100%; }
        img { border: 0; }
        
        /* Layout */
        .wrapper { width: 100%; table-layout: fixed; background-color: #f4f7fa; padding-bottom: 40px; }
        .main { background-color: #ffffff; margin: 0 auto; width: 100%; max-width: 600px; border-spacing: 0; font-family: sans-serif; color: #4a4a4a; border-radius: 8px; overflow: hidden; margin-top: 20px; }
        
        /* Brand Colors & Header */
        .header { background-color: #080C14; padding: 30px; text-align: center; color: #ffffff; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; color: #FFB173; text-decoration: none; }
        
        /* Content Area */
        .content { padding: 40px 30px; line-height: 1.6; font-size: 16px; }
        
        /* Footer */
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #9b9b9b; }
        .footer a { color: #FFB173; text-decoration: none; }

        /* Mobile adjustments */
        @media screen and (max-width: 600px) {
            .content { padding: 20px !important; }
        }
    </style>
</head>
<body>
    <center class="wrapper">
        <table class="main" width="100%">
            <!-- Header/Logo -->
            <tr>
                <td class="header" align="center">
                    <a href="{{ settings.FRONTEND_URL }}" class="logo" style="display: inline-block; text-decoration: none; color: #FFB173; font-size: 24px; font-weight: bold; letter-spacing: -1px; line-height: 32px; vertical-align: middle;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB173" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px; display: inline-block;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                        </svg>
                        <span style="vertical-align: middle;">NEOEVENT</span>
                    </a>
                </td>
            </tr>

            <!-- Dynamic Content Body -->
            <tr>
                <td class="content">
                    {% block content %}
                    <!-- Sub-templates will inject their content here -->
                    {% endblock %}
                </td>
            </tr>

            <!-- Footer -->
            <tr>
                <td class="footer">
                    <p>&copy; 2026 Neo Events Inc. All rights reserved.</p>
                    <p>
                        Lagos, Nigeria | 
                        <a href="{{ settings.FRONTEND_URL }}/privacy">Privacy Policy</a> | 
                        <a href="{{ settings.FRONTEND_URL }}/support">Support</a>
                    </p>
                    <p>You received this email because you are registered with Neo Events.</p>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
