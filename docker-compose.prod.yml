version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: neoevents_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: neoevents_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: neoevents_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always


  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: neoevents_fastapi
    command: uvicorn media_classifier.main:app --host 0.0.0.0 --port 8002 --workers 2
    ports:
      - "8002:8002"
    env_file:
      - .env.prod
    depends_on:
      - db
    restart: always

volumes:
  redis_data:
  postgres_data:
